apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-node
  labels:
    app: product-service-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service-node
  template:
    metadata:
      labels:
        app: product-service-node
    spec:
      initContainers:
        - name: product-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: name
      containers:
        - name: product-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3006"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: name
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: product-rabbitmq
                  key: url
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            - name: OTEL_SERVICE_NAME
              value: "product-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Sin `limits` a proposito: un tope de CPU de 300m estrangulaba al servicio (throttle)
            # y las pruebas de stress-petitions medían el limite de Kubernetes, no la capacidad
            # del codigo, con el nodo casi ocioso. Se conservan los `requests` (reserva).
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 10
